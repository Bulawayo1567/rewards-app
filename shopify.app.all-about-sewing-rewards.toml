# Production config — installed on the live store, served from Vercel.

client_id = "80e96e856228eb6f1acc26acef8b8533"
application_url = "https://aas-rewards.vercel.app"
embedded = true
name = "All About Sewing Rewards"

[access_scopes]
scopes = "read_customers,write_customers,read_orders,write_discounts,read_products,write_products,read_marketing_events,write_app_proxy"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/webhooks/customers/create"

  [[webhooks.subscriptions]]
  topics = [ "customers/update" ]
  uri = "/webhooks/customers/update"

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "rewards"

[auth]
redirect_urls = [ "https://aas-rewards.vercel.app/api/auth" ]

[build]
automatically_update_urls_on_dev = false
